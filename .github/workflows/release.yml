name: Android release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build web assets and sync Capacitor
        run: npm run build && npx cap sync android

      - name: Select release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          base_version="$(sed -nE 's/^[[:space:]]*def defaultVersionName = "([^"]+)".*/\1/p' android/app/build.gradle | head -n 1)"
          base_code="$(sed -nE 's/^[[:space:]]*def defaultVersionCode = ([0-9]+).*/\1/p' android/app/build.gradle | head -n 1)"
          if [[ -z "$base_version" || -z "$base_code" ]]; then
            echo 'Unable to read the Android base version from android/app/build.gradle.' >&2
            exit 1
          fi

          releases="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100")"
          existing_tag="$(jq -r --arg sha "$GITHUB_SHA" '[.[] | select((.body // "") | contains($sha)) | .tag_name] | first // empty' <<< "$releases")"
          tags="$(gh api "repos/${GITHUB_REPOSITORY}/tags?per_page=100" --jq '.[].name' || true)"

          if [[ -n "$existing_tag" ]]; then
            version_name="${existing_tag#v}"
          else
            highest_tag="$(printf '%s\n%s\n' "$tags" "$(jq -r '.[].tag_name' <<< "$releases")" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
            version_name="$base_version"
            if [[ -n "$highest_tag" ]]; then
              highest_version="${highest_tag#v}"
              if [[ "$(printf '%s\n%s\n' "$version_name" "$highest_version" | sort -V | tail -n 1)" == "$highest_version" ]]; then
                IFS=. read -r major minor patch <<< "$highest_version"
                version_name="${major}.${minor}.$((patch + 1))"
              fi
            fi

            while grep -qx "v${version_name}" <<< "$tags"; do
              IFS=. read -r major minor patch <<< "$version_name"
              version_name="${major}.${minor}.$((patch + 1))"
            done
          fi

          IFS=. read -r base_major base_minor base_patch <<< "$base_version"
          IFS=. read -r release_major release_minor release_patch <<< "$version_name"
          version_code=$((base_code + release_patch - base_patch))
          if (( version_code < base_code )); then
            version_code="$base_code"
          fi

          {
            echo "version_name=$version_name"
            echo "version_code=$version_code"
            echo "tag=v${version_name}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and verify debug APK
        working-directory: android
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          test -f app/debug.keystore
          keytool -list -keystore app/debug.keystore -storepass android -alias androiddebugkey >/dev/null
          ./gradlew :app:assembleDebug -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE"

          apk_path="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk_path"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk_path"
          package_name="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk_path" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)"
          test "$package_name" = 'com.samielmadani.callbridge'

      - name: Prepare release APK
        id: apk
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          set -euo pipefail
          output_path="android/app/build/outputs/apk/debug/callbridge-${VERSION_NAME}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$output_path"
          echo "path=$output_path" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          APK_PATH: ${{ steps.apk.outputs.path }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        shell: bash
        run: |
          set -euo pipefail
          notes="$(printf 'CallBridge %s\n\nVersion code: %s\nCommit SHA: %s' "$VERSION_NAME" "$VERSION_CODE" "$GITHUB_SHA")"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK_PATH" --clobber
          else
            gh release create "$RELEASE_TAG" "$APK_PATH" \
              --target "$GITHUB_SHA" \
              --title "CallBridge ${VERSION_NAME}" \
              --notes "$notes" \
              --generate-notes
          fi