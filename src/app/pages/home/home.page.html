<ion-content [fullscreen]="true">
  <main class="home-page">
    <header class="home-heading">
      <p class="eyebrow">CALLBRIDGE / YOUR SPACE</p>
      <h1>Closer, even<br /><em>from here.</em></h1>
      <p>Set your caller details, then open any FaceTime link to join.</p>
    </header>

    <section class="home-section profile-section">
      <div class="section-title">
        <span>01</span>
        <h2>Your profile</h2>
      </div>
      <ion-input
        label="Your name"
        label-placement="stacked"
        type="text"
        placeholder="Enter your name"
        [(ngModel)]="userName"
        debounce="500"
        (ionInput)="onUserNameChange($event.detail.value || '')"
      ></ion-input>
      <div class="home-toggle">
        <div>
          <h3>Auto-join</h3>
          <p>Fill in your saved name when a call opens.</p>
        </div>
        <ion-toggle [checked]="autoJoinEnabled" (ionChange)="toggleAutoJoin($event.detail.checked)" aria-label="Auto-join calls"></ion-toggle>
      </div>
    </section>

    <section class="home-section quick-section">
      <div class="section-title">
        <span>02</span>
        <h2>Go somewhere</h2>
      </div>
      <button type="button" class="home-link primary-link" (click)="navigateToCall()">
        <span>Open a call</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13m-5-5 5 5-5 5" /></svg>
      </button>
      <button type="button" class="home-link" (click)="navigateToHistory()">
        <span>Call history</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13m-5-5 5 5-5 5" /></svg>
      </button>
    </section>
  </main>
</ion-content>
