<ion-header>
  <ion-toolbar>
    <ion-title>Call</ion-title>
    <ion-buttons slot="end">
      <ion-button routerLink="/tabs/settings" aria-label="Open settings">
        <ion-icon slot="icon-only" name="settings-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <main class="call-screen" [class.call-active]="!!currentCall">
    <ng-container *ngIf="currentCall; else idleCall">
      <section class="active-call-state" aria-live="polite">
        <div class="call-state-icon">
          <ion-icon name="videocam-outline"></ion-icon>
        </div>
        <p class="eyebrow">{{ getFormattedTime(callDuration) }}</p>
        <h1>FaceTime call</h1>
        <p class="call-detail">{{ userName || 'Joining as a guest' }}</p>
        <p class="call-detail" *ngIf="isEmbeddedCallOpen">Open in CallBridge</p>
        <ion-button class="end-call-button" color="danger" (click)="endCall()">
          <ion-icon slot="start" name="call"></ion-icon>
          End call
        </ion-button>
      </section>
      <iframe
        *ngIf="callFrame"
        class="call-frame"
        [src]="callFrame"
        title="FaceTime call"
        allow="camera; microphone; autoplay; fullscreen"
        allowfullscreen
      ></iframe>
    </ng-container>

    <ng-template #idleCall>
      <section class="idle-call-state">
        <div class="call-mark" aria-hidden="true">
          <ion-icon name="videocam-outline"></ion-icon>
          <span class="bridge-mark"></span>
        </div>
        <p class="eyebrow">CALLBRIDGE</p>
        <h1>Ready when they call.</h1>
        <p class="call-intro">Open a FaceTime link here, or paste one to join.</p>
        <div class="call-entry">
          <ion-input
            label="FaceTime link"
            label-placement="stacked"
            type="url"
            placeholder="facetime.apple.com/join/..."
            [(ngModel)]="callUrl"
            (keyup.enter)="joinCall()"
            clearInput
          ></ion-input>
          <ion-button expand="block" (click)="joinCall()">
            <ion-icon slot="start" name="arrow-forward-circle-outline"></ion-icon>
            Join call
          </ion-button>
        </div>
        <p class="call-hint">FaceTime links open inside CallBridge.</p>
      </section>
    </ng-template>
  </main>
</ion-content>
